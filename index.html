<style>

button,select,input,textarea{font:inherit;color:var(--t)}

.btn.o{background:none;color:var(--p);border:1px solid var(--p)}.btn.d{background:none;color:#b91c1c;border:1px solid #b91c1c}.btn.s{padding:4px 10px;min-height:32px;font-size:13px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}.grid .card{margin:0}.grid b{display:block;font-size:26px;color:var(--p)}
.wrap{overflow-x:auto;border:1px solid var(--b);border-radius:12px;background:var(--c);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--b);border-left:1px solid var(--b);padding:4px 6px;text-align:center;white-space:nowrap}
th{background:var(--pl);position:sticky;top:0;z-index:2;font-size:13px}
.nm{position:sticky;right:0;background:var(--c);text-align:right;min-width:130px;z-index:1;font-weight:600}th.nm{background:var(--pl);z-index:3}
td input{width:74px;text-align:center;border-color:transparent;background:transparent}td input:focus{border-color:var(--p);background:var(--c)}
td input.nt{width:150px;text-align:right}
td.lk{background:var(--lk)}.av{font-weight:700;color:var(--p)}:root{--c1:#dbeafe;--c2:#ede9fe;--cm:#fef3c7;--cs:#fce7f3;--ce:#cffafe;--cf:#dcfce7}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--c1:#1e3a5f;--c2:#3b2f63;--cm:#5a4a14;--cs:#5c2a45;--ce:#14505a;--cf:#1d4d2e}}.t1{background:var(--c1)}.t2{background:var(--c2)}.km{background:var(--cm)}.ks{background:var(--cs)}.ke{background:var(--ce)}.kf{background:var(--cf)}tr.gh th{position:static;background:var(--p);color:#fff}
.bd{font-size:11px;font-weight:400;color:var(--m)}.wn{color:var(--w)}
#md{display:none;position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:12px}#md.show{display:block}
#md>div{background:var(--c);border-radius:14px;padding:14px;max-width:900px;margin:auto}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--b);border-radius:20px;margin:2px;background:var(--c)}.chip.on{background:var(--p);color:#fff}
#toast{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:30;display:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--b)}
small,.m{color:var(--m)}.cc{border:1px solid var(--b);border-radius:12px;padding:10px;margin:10px 0}.chs{display:flex;flex-wrap:wrap;gap:6px}.chk{border:1px solid var(--b);border-radius:20px;padding:6px 12px;background:var(--c);white-space:nowrap}#ft{text-align:center;color:var(--m);font-size:12px;padding:8px 0}
.bar.noprint>.btn,.bar.noprint>select,.bar.noprint>input[type=date]{flex:1 1 140px;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center}.bar.noprint>.btn.s{font-size:14px;padding:10px 12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.ccard{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;cursor:pointer;box-shadow:0 1px 4px #0001}.ccard .cn{font-size:17px;font-weight:700;color:var(--p);margin-bottom:4px}
.stat{cursor:pointer;text-align:center}.stat b{font-size:30px}.stat:active,.ccard:active{transform:scale(.97)}
.hero{background:linear-gradient(135deg,var(--p),#3aa38f);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}.hero .hs{font-size:12px;opacity:.85}.hero .q{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-size:22px;line-height:2;margin:8px 0}.hero .hb{background:#fff3;border:0;color:#fff;border-radius:20px;padding:6px 14px}
#fsx{display:none;position:fixed;top:8px;left:8px;z-index:45}body.fs #fsx{display:block}body.fs .wrap{position:fixed;inset:0;z-index:40;max-height:none;height:100%;border-radius:0;padding-top:50px}
.pi,.pcv{display:none}@media print{.pi{display:block;text-align:center;border-bottom:2px solid #000;margin-bottom:8px;padding-bottom:4px;font-size:13px}.pcv{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:85vh;text-align:center;break-after:page;border:3px double #000;padding:30px;font-size:18px}body.fs .wrap{position:static;height:auto;padding-top:0}#fsx{display:none!important}}
@media print{th,td{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{break-after:page}.pg:last-child{break-after:auto}@page{size:A4;margin:10mm}body{background:#fff;color:#000;padding:0}header,.nav,.noprint{display:none!important}.wrap{max-height:none;overflow:visible}.nm{position:static}th{position:static}td,th{font-size:11px}td input{width:auto;max-width:60px}body.mo #main{display:none}#md{position:static;background:none;padding:0}}
</style><link href="https://fonts.googleapis.com/css2?family=Amiri:ital@1&display=swap" rel="stylesheet"></head><body>
<header><h1>📒 دفتر الدرجات الذكي</h1><select id="sx" aria-label="الشعبة"></select><small id="st"></small></header>
<div id="main"></div><div id="md"></div><div id="toast"></div><footer id="ft"></footer><button id="fsx" class="btn" data-a="fs">✕ خروج من ملء الشاشة</button>
<nav class="nav"><button data-a="tab" data-t="home">الرئيسية</button><button data-a="tab" data-t="str">الصفوف</button><button data-a="tab" data-t="daily">اليومي</button><button data-a="tab" data-t="month">الشهري</button><button data-a="tab" data-t="stu">الوسطي</button><button data-a="tab" data-t="set">الإعدادات</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),fmt=v=>v==null||v===''?'':isNaN(v)?v:+(+v).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
let S={classes:[],sections:[],students:[],cols:[],scores:{},log:[],cfg:{z:false,scale:100}},UI={tab:'home',sec:null,date:today(),mb:null},IDX=null;
/* storage */
const dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('gradebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function load(){try{const db=await dbp;return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
let tm;function save(){clearTimeout(tm);tm=setTimeout(async()=>{try{const db=await dbp;db.transaction('kv','readwrite').objectStore('kv').put(S,'state');$('#st').textContent='✓ محفوظ'}catch(e){$('#st').textContent='⚠ تعذر الحفظ'}},150)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}
function modal(h){$('#md').innerHTML='<div>'+h+'</div>';$('#md').classList.add('show');document.body.classList.add('mo')}
function closeM(){$('#md').classList.remove('show');document.body.classList.remove('mo');UI.mb=null;UI.cm=null}
function conf(msg,fn){window._cf=fn;window._cm=UI.cm;modal(`<p>${msg}</p><div class=bar><button class="btn d" data-a="cfy">نعم، تأكيد</button><button class="btn o" data-a="x">إلغاء</button></div>`)}
/* helpers */
const sec=()=>S.sections.find(x=>x.id==UI.sec),col=id=>S.cols.find(c=>c.id==id),cols=(s,b)=>S.cols.filter(c=>c.sec==s&&c.book==b),studs=s=>S.students.filter(x=>x.sec==s&&!x.arch);
const secName=s=>{const c=S.classes.find(x=>x.id==s.cls);return(c?c.name:'')+' / '+s.name};
function idx(){if(IDX)return IDX;IDX={};for(const k in S.scores){if(k[0]!='d')continue;const[,c,s,d]=k.split('|');if(typeof S.scores[k]!='number')continue;(IDX[c+'|'+s]??=[]).push([d,S.scores[k]]);if(col(c)&&!col(c).hidden){const q='tot:'+(col(c).rec||'r1')+'|'+s;IDX[q]??=[];let e=IDX[q].find(x=>x[0]==d);if(!e)IDX[q].push(e=[d,0]);e[1]+=S.scores[k]}}for(const k in IDX)IDX[k].sort((a,b)=>a[0]<b[0]?-1:1);return IDX}
function src(c){if(!c.link||c.link==='none')return{cols:[]};if(c.link.startsWith('tot')){const r=c.link.split(':')[1]||'r1',q=recs(S.sections.find(x=>x.id==c.sec)).find(y=>y.id==r);return q?{cols:[{id:'tot:'+r,name:'مجموع '+q.name}],man:1}:{cols:[]}}if(c.link!='auto'){const x=col(c.link);return{cols:x?[x]:[],man:1}}const mt=(months(S.sections.find(x=>x.id==c.sec)).find(y=>y.id==c.book)||{}).t,m=cols(c.sec,'daily').filter(k=>k.name.trim()==c.name.trim()&&(recs(S.sections.find(x=>x.id==c.sec)).find(r=>r.id==(k.rec||'r1'))||{}).t==mt);return{cols:m.slice(0,1),dup:m.length>1}}
function agg(a,m){if(!a.length)return null;const v=a.map(x=>x[1]);const s=v.reduce((x,y)=>x+y,0);return m=='max'?Math.max(...v):m=='sum'?s:m=='avg'?s/v.length:v[v.length-1]}
function cell(c,st){if(c.book!='daily'){const s=src(c);if(s.cols.length){const mo=(months(S.sections.find(x=>x.id==c.sec)).find(m=>m.id==c.book)||{}).mo;let a=idx()[s.cols[0].id+'|'+st.id]||[];if(mo)a=a.filter(x=>x[0].slice(0,7)==mo);const v=agg(a,c.agg);return{v:v==null?null:Math.round(v),l:1,src:s.cols[0]}}}const v=S.scores['m|'+c.id+'|'+st.id];return{v:typeof v=='number'?v:null,raw:v}}
function avg(st,b){let n=0,d=0;for(const c of cols(st.sec,b)){if(c.hidden||!(c.max>0))continue;const w=+c.w||1,x=cell(c,st).v;if(x==null){if(S.cfg.z)d+=w;continue}n+=x/c.max*w;d+=w}return d?Math.round(n/d*S.cfg.scale):null}
const months=s=>s.months??=[{id:'m1',name:'الشهر الأول',mo:s.m1||'',t:1},{id:'m2',name:'الشهر الثاني',mo:s.m2||'',t:1}];
const terms0=x=>{const ms=months(S.sections.find(s=>s.id==x.sec)),t=n=>{const v=ms.filter(m=>m.t==n).map(m=>avg(x,m.id)).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null},f1=t(1),f2=t(2),r=[f1,f2].filter(v=>v!=null);return{f1,mid:f1,f2,fin:r.length?r.reduce((a,b)=>a+b,0)/r.length:null}};
const avOf=(x,k)=>k.startsWith('avg:')?avg(x,k.slice(4)):k.startsWith('sum:')?gsum(x,k.slice(4)):terms(x)[k],sem=x=>{const t=terms(x);return t.fin??t.sa};
const dayTot=(x,d,cs)=>{let t=0,n=0;cs.forEach(c=>{const v=S.scores['d|'+c.id+'|'+x.id+'|'+d];if(typeof v=='number'){t+=v;n++}});return n?t:null};
function setS(k,v,meta){const o=S.scores[k];v=v==='غائب'?v:(v===''||v==null||isNaN(v))?null:+v;if((o??null)===v)return;if(v==null)delete S.scores[k];else S.scores[k]=v;S.log.unshift({t:Date.now(),o:o??null,n:v,...meta});if(S.log.length>5000)S.log.length=5000;IDX=null;save()}
/* views */
const V={};const nosec=()=>'<div class=card>أنشئ صفاً وشعبة أولاً من تبويب «الصفوف».</div>';
function secSel(){const x=$('#sx');x.innerHTML=S.sections.map(s=>`<option value="${s.id}" ${s.id==UI.sec?'selected':''}>${esc(secName(s))}</option>`).join('')||'<option>لا توجد شعب</option>'}
V.home=()=>{const st=S.students.filter(x=>!x.arch);let h=`<h2>لوحة التحكم</h2><div class=grid><div class=card><b>${S.classes.length}</b>صفوف</div><div class=card><b>${S.sections.length}</b>شعب</div><div class=card><b>${st.length}</b>طلاب</div><div class=card><b>${S.log.length}</b>تعديلات مسجلة</div></div>`;
if(!S.sections.length)return h+nosec();const ss=studs(UI.sec),r=ss.map(s=>({s,v:sem(s)})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
h+=`<div class=card><b>${esc(secName(sec()))}</b><br>عدد الطلاب: ${ss.length}<br>متوسط الشعبة (فصلي): ${r.length?fmt(r.reduce((a,b)=>a+b.v,0)/r.length):'—'}<br>دون ٥٠٪: ${r.filter(x=>x.v<S.cfg.scale/2).length}</div>`;
if(r.length)h+=`<div class=card><b>الأعلى</b><br>${r.slice(0,3).map(x=>esc(x.s.name)+' — '+fmt(x.v)).join('<br>')}</div>`;return h};
V.str=()=>{let h=`<h2>الصفوف والشعب والطلاب</h2><div class=card><div class=bar><input id=nc placeholder="اسم الصف (مثل: الرابع الإعدادي)"><button class=btn data-a=addClass>إضافة صف</button></div>`;
if(S.classes.length)h+=`<div class=bar><select id=nsc>${S.classes.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select><input id=ns placeholder="اسم الشعبة (أ، ب...)"><button class=btn data-a=addSec>إضافة شعبة</button></div>`;h+='</div>';
for(const c of S.classes){h+=`<div class=card><b>${esc(c.name)}</b> <button class="btn d s" data-a=delClass data-id=${c.id}>حذف الصف</button><br>`+S.sections.filter(s=>s.cls==c.id).map(s=>`<span class="chip ${s.id==UI.sec?'on':''}" data-a=pick data-id=${s.id}>${esc(s.name)}</span>`).join('')+'</div>'}
const s=sec();if(s){const ss=S.students.filter(x=>x.sec==s.id);h+=`<div class=card><b>طلاب ${esc(secName(s))}</b> <button class="btn d s" data-a=delSec>حذف الشعبة</button><div class=bar style="margin-top:8px"><input id=nst placeholder="اسم الطالب"><button class=btn data-a=addStu>إضافة</button></div><textarea id=bulk placeholder="استيراد قائمة: اسم في كل سطر"></textarea><button class="btn o" data-a=bulk>استيراد القائمة</button><div style="margin-top:8px">`+ss.map((x,i)=>`<div class=row style="${x.arch?'opacity:.5':''}"><span class=m>${i+1}</span><input data-k=sn data-id=${x.id} value="${esc(x.name)}" style="flex:1;min-width:140px"><select data-k=mv data-id=${x.id}><option value="">نقل إلى…</option>${S.sections.filter(y=>y.id!=s.id).map(y=>`<option value=${y.id}>${esc(secName(y))}</option>`).join('')}</select><button class="btn o s" data-a=arch data-id=${x.id}>${x.arch?'استرجاع':'أرشفة'}</button><button class="btn d s" data-a=delStu data-id=${x.id}>حذف</button></div>`).join('')+'</div></div>'}return h};
function tools(){return`<button class="btn o s" data-a=copy>نسخ للـ Excel</button><button class="btn o s" data-a=print>طباعة / PDF</button><button class="btn o s" data-a=phc>أعمدة الطباعة</button>`}
V.daily=()=>{const s=sec();if(!s)return nosec();const cs=dcols(s.id,rec()).filter(c=>!c.hidden),ss=studs(s.id),d=UI.date;
let dup=[...new Set(cs.map(c=>c.name))].filter(n=>cs.filter(c=>c.name==n).length>1);
let h=`<h2>السجل اليومي</h2><div class="bar noprint"><input type=date id=dt value="${d}"><select data-k=rec>${recs(s).map(r=>`<option value=${r.id} ${r.id==rec()?'selected':''}>${esc(r.name)} (ف${r.t})</option>`).join('')}</select><button class="btn o" data-a=recs>السجلات / نسخ</button><button class=btn data-a=cols data-b=daily>الخانات</button>${tools()}</div>`+(dup.length?`<p class=wn>⚠ يوجد أكثر من خانة بالاسم نفسه: ${esc(dup.join('، '))}</p>`:'');
if(!cs.length)return h+'<div class=card>أضف خانات (القراءة، الواجب، المشاركة…) من زر «الخانات».</div>';
h+=`<div class=wrap><table id=tbl><tr><th class=nm>الطالب</th>${cs.map(c=>`<th>${esc(c.name)}<br><span class=bd>من ${c.max}</span></th>`).join('')}<th>المجموع<br><span class=bd>من ${cs.reduce((a,c)=>a+c.max,0)}</span></th><th>ملاحظة</th></tr>`;
for(const x of ss){const ab=S.scores['a|'+x.id+'|'+d];h+=`<tr><td class=nm>${esc(x.name)}</td>${cs.map(c=>`<td><input type=text inputmode=decimal data-k=d data-c=${c.id} data-s=${x.id} value="${fmt(S.scores['d|'+c.id+'|'+x.id+'|'+d])}"></td>`).join('')}<td class="av tt">${fmt(dayTot(x,d,cs))}</td><td><input class=nt data-k=n data-s=${x.id} value="${esc(S.scores['n|'+x.id+'|'+d]||'')}"></td></tr>`}return h+'</table></div>'};
function avCells(x){const f=v=>`<td class=av>${fmt(avg(x,v))}</td>`;return f('m1')+''}
function rowAv(x,tag){const a=avg(x,'m1'),b=avg(x,'m2'),c=sem(x);return{a,b,c}}
V.month=()=>{const s=sec();if(!s)return nosec();const g=b=>cols(s.id,b).filter(c=>!c.hidden),ss=studs(s.id);
const th=c=>{const k=src(c);return`<th>${esc(c.name)}<br><span class=bd>من ${c.max} ${k.cols.length?(k.dup?'<span class=wn>⚠ تعارض</span>':'🔗'+(k.man?' يدوي':' تلقائي')):''}</span></th>`};
let h=`<h2>السجل الشهري</h2><div class="bar noprint"><label>شهر ١ <input type=month data-k=mo data-b=m1 value="${s.m1||''}"></label><label>شهر ٢ <input type=month data-k=mo data-b=m2 value="${s.m2||''}"></label><button class=btn data-a=cols data-b=m1>خانات ١</button><button class=btn data-a=cols data-b=m2>خانات ٢</button>${tools()}</div>`;

/* ===== نظام التحديث التلقائي ===== */
const APP_VERSION='1.2.0';
const UP={latest:null,notes:'',st:'',waiting:null,last:null,bks:[],auto:true,later:false,reload:false};let reg=null;

const bkKeys=async()=>(await tx('readonly',s=>s.getAllKeys())).filter(k=>String(k).startsWith('bk:')).sort();
async function preBackup(){try{await tx('readwrite',s=>s.put(JSON.parse(JSON.stringify(S)),'bk:'+Date.now()+':'+APP_VERSION));const ks=await bkKeys();for(const k of ks.slice(0,-3))await tx('readwrite',s=>s.delete(k));UP.bks=(await bkKeys()).reverse()}catch(e){}}

const hasUpd=()=>!!UP.waiting||(UP.latest&&cmp(UP.latest,APP_VERSION)>0);

b.innerHTML=`<span style="flex:1">🔔 يتوفر تحديث ${esc(UP.latest||'')}${UP.notes?' — '+esc(UP.notes):''}</span><button class="btn s" style="background:#fff;color:var(--p)" data-a=updNow>تحديث الآن</button><button class="btn s" style="background:#0003" data-a=updLater>لاحقاً</button>`}

try{reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
